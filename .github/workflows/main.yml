name: RHACS Connectivity Test

on:
  workflow_dispatch:   # Allows manual run from GitHub UI

jobs:
  test-rhacs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rhacs-cli
        run: |
          curl -L https://mirror.openshift.com/pub/rhacs/assets/latest/bin/Linux/rhacs-cli \
            -o rhacs-cli
          chmod +x rhacs-cli

      - name: Test RHACS connection
        env:
          ROX_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
        run: |
          ./rhacs-cli version
