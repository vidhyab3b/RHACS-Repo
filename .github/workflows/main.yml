name: RHACS Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-rhacs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download roxctl from Central (authenticated)
        env:
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
          ROX_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
        run: |
          curl -k -L \
            -H "Authorization: Bearer $ROX_API_TOKEN" \
            https://$ROX_CENTRAL_ADDRESS/api/cli/download/roxctl-linux \
            -o roxctl
          chmod +x roxctl

      - name: Verify roxctl binary
        run: |
          file roxctl

      - name: Test RHACS connection
        env:
          ROX_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
          ROX_INSECURE_CLIENT_TLS: "true"
        run: |
          ./roxctl version
