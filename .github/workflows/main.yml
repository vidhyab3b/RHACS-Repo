name: RHACS Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-rhacs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download rhacs-cli from Central
        env:
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
        run: |
          curl -k -L https://$ROX_CENTRAL_ADDRESS/api/cli/download/rhacs-cli-linux \
            -o rhacs-cli
          chmod +x rhacs-cli

      - name: Test RHACS connection
        env:
          ROX_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
          ROX_INSECURE_CLIENT_TLS: "true"
        run: |
          ./rhacs-cli version
