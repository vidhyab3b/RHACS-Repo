name: RHACS Policy as Code (YAML)

on:
  workflow_dispatch:  # Allows manual trigger
  push:
    branches: [ main ]  # Run on pushes to main

jobs:
  policy-as-code:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Download roxctl from RHACS Central
      - name: Download roxctl
        env:
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
          ROX_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
        run: |
          curl -k -L \
            -H "Authorization: Bearer $ROX_API_TOKEN" \
            https://$ROX_CENTRAL_ADDRESS/api/cli/download/roxctl-linux \
            -o roxctl
          chmod +x roxctl

      # Convert YAML policies to JSON
      - name: Convert policies YAML → JSON
        run: |
          mkdir -p policies-json
          for file in policies/**/*.yaml; do
            yq -o=json '.' "$file" > "policies-json/$(basename "$file" .yaml).json"
          done

      # Validate policies
      - name: Validate policies
        run: |
          ./roxctl policy validate policies-json/

      # Import policies into RHACS
      - name: Import policies into RHACS
        env:
          ROX_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
          ROX_CENTRAL_ADDRESS: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
          ROX_INSECURE_CLIENT_TLS: "true"
        run: |
          ./roxctl policy import policies-json/
