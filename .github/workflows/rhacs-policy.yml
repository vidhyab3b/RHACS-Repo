name: RHACS Policy as Code (YAML → API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  policy-as-code:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq jq

      - name: Convert policies YAML → JSON
        run: |
          mkdir -p policies-json
          for file in policies/**/*.yaml; do
            yq -o=json '.' "$file" > "policies-json/$(basename "$file" .yaml).json"
          done

      - name: Import policies into RHACS via API
        env:
          RHACS_API_TOKEN: ${{ secrets.RHACS_API_TOKEN }}
          RHACS_CENTRAL_ENDPOINT: ${{ secrets.RHACS_CENTRAL_ENDPOINT }}
        run: |
          for file in policies-json/*.json; do
            echo "Importing policy $file"
            curl -k -X POST "https://$RHACS_CENTRAL_ENDPOINT/v1/policies" \
              -H "Authorization: Bearer $RHACS_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$file"
          done
