apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: require-readonly-rootfs
  namespace: stackrox
  annotations:
    argocd.argoproj.io/tracking-id: rhacs-policies:config.stackrox.io/SecurityPolicy:stackrox/require-readonly-rootfs
spec:
  policyName: Require readonly root filesystem
  categories:
    - Security
  severity: HIGH_SEVERITY
  lifecycleStages:
    - DEPLOY
  policySections:
    - name: Root Filesystem
      description: Ensure containers are readonly
      policyGroups:
        - name: Root Filesystem
          fieldName: rootfs
          policies:
            - name: Require readonly root filesystem
              description: Containers must have read-only rootfs
              type: K8S
