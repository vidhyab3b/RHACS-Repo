apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: require-readonly-rootfs
spec:
  policyName: "Require readonly root filesystem"   # ✅ REQUIRED
  categories:
    - Security
  severity: HIGH_SEVERITY                             # ✅ Must use *_SEVERITY
  lifecycleStages:
    - DEPLOY
  policySections:
    - name: Root Filesystem
      description: Ensure containers are readonly
      policyGroups:
        - name: Root Filesystem
          fieldName: rootfs                       # ✅ REQUIRED
          policies:
            - name: Require readonly root filesystem
              description: Containers must have read-only rootfs
              type: K8S
